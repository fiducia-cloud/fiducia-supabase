name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fiducia-supabase-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-and-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"
      - name: Install pinned validation dependencies
        run: npm ci --ignore-scripts
      - name: Run migration contracts and provider-overlay validation
        run: npm test
